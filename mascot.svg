<g id="content">
  <text x="24" y="52" class="base c_comment l0" xml:space="preserve">// &gt;&gt;&gt; USAGI_SCRIPT.ura &lt;&lt;&lt;</text>
  <text x="24" y="65" class="base c_keyword l1" xml:space="preserve">import { yaha, ura, pulululu, haa, iyaaha } from &quot;chiikawa&quot;;</text>
  <text x="24" y="79" class="base c_normal l2" xml:space="preserve"></text>
  <text x="24" y="92" class="base c_keyword l3" xml:space="preserve">function usagi_routine() {</text>
  <text x="24" y="106" class="base c_string l4" xml:space="preserve">    const battle_cry = &quot;URA! URARURA! URAAAAA!&quot;;</text>
  <text x="24" y="119" class="base c_string l5" xml:space="preserve">    const excitement = &quot;YAHA! YAHA! YAHA!&quot;;</text>
  <text x="24" y="133" class="base c_normal l6" xml:space="preserve">    while (energy &gt; 0) {</text>
  <text x="24" y="146" class="base c_fn l7" xml:space="preserve">        scream(battle_cry);</text>
  <text x="24" y="160" class="base c_string l8" xml:space="preserve">        dance(&quot;IYAA-HA! FUUUN~ WAHA!&quot;);</text>
  <text x="24" y="173" class="base c_fn l9" xml:space="preserve">        vibrate(&quot;PULULULULULULU~~~~~!&quot;);</text>
  <text x="24" y="187" class="base c_normal l10" xml:space="preserve">    }</text>
  <text x="24" y="200" class="base c_keyword l11" xml:space="preserve">    return &quot;HAA?!&quot;;</text>
  <text x="24" y="214" class="base c_keyword l12" xml:space="preserve">}</text>
