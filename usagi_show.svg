<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 776" width="100%" height="auto">
<style>

  .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10px; }
  .titlebar { fill: #161b22; }
  
  @keyframes codeLive {
    0% { opacity: 0; }
    1% { opacity: 1; }
    92% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes hideContainer {
    to { opacity: 0; visibility: hidden; }
  }
  @keyframes appearArt {
    to { opacity: 1; }
  }

  .code-container {
    animation: hideContainer 0.1s forwards;
    animation-delay: 2.8s;
  }

  .code-text {
    font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    font-size: 13px;
    opacity: 0;
  }
  .c_comment { fill: #8b949e; font-style: italic; }
  .c_keyword { fill: #ff7b72; font-weight: 600; }
  .c_string  { fill: #a5d6ff; }
  .c_fn      { fill: #d2a8ff; }
  .c_normal  { fill: #c9d1d9; }

  .art-text {
    font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    font-size: 12.5px;
    fill: #00F2FE;
    opacity: 0;
    animation: appearArt 0.01s forwards;
  }
  .cl0 { animation: codeLive 2.800s forwards; animation-delay: 0.000s; }
  .cl1 { animation: codeLive 2.700s forwards; animation-delay: 0.100s; }
  .cl2 { animation: codeLive 2.600s forwards; animation-delay: 0.200s; }
  .cl3 { animation: codeLive 2.500s forwards; animation-delay: 0.300s; }
  .cl4 { animation: codeLive 2.400s forwards; animation-delay: 0.400s; }
  .cl5 { animation: codeLive 2.300s forwards; animation-delay: 0.500s; }
  .cl6 { animation: codeLive 2.200s forwards; animation-delay: 0.600s; }
  .cl7 { animation: codeLive 2.100s forwards; animation-delay: 0.700s; }
  .cl8 { animation: codeLive 2.000s forwards; animation-delay: 0.800s; }
  .cl9 { animation: codeLive 1.900s forwards; animation-delay: 0.900s; }
  .cl10 { animation: codeLive 1.800s forwards; animation-delay: 1.000s; }
  .cl11 { animation: codeLive 1.700s forwards; animation-delay: 1.100s; }
  .cl12 { animation: codeLive 1.600s forwards; animation-delay: 1.200s; }
  .cl13 { animation: codeLive 1.500s forwards; animation-delay: 1.300s; }
  .cl14 { animation: codeLive 1.400s forwards; animation-delay: 1.400s; }
  .al0 { animation-delay: 3.100s; }
  .al1 { animation-delay: 3.175s; }
  .al2 { animation-delay: 3.250s; }
  .al3 { animation-delay: 3.325s; }
  .al4 { animation-delay: 3.400s; }
  .al5 { animation-delay: 3.475s; }
  .al6 { animation-delay: 3.550s; }
