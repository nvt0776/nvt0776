<rect width="984" height="776" class="bg" />
<path d="M 0,10 A 10,10 0 0,1 10,0 L 974,0 A 10,10 0 0,1 984,10 L 984,34 L 0,34 Z" class="titlebar" />
<circle cx="20" cy="17" r="5.5" fill="#ff5f56" />
<circle cx="38" cy="17" r="5.5" fill="#ffbd2e" />
<circle cx="56" cy="17" r="5.5" fill="#27c93f" />

<!-- Phase 1: Code in Usagi Language (Lives until 2.8s, then vanishes completely) -->
<g class="code-container">
  <text x="24" y="50" class="code-text c_comment cl0" xml:space="preserve">// &gt;&gt;&gt; USAGI_SCRIPT.ura &lt;&lt;&lt;</text>
  <text x="24" y="68" class="code-text c_keyword cl1" xml:space="preserve">import { yaha, ura, pulululu, haa, iyaaha } from &quot;chiikawa&quot;;</text>
  <text x="24" y="86" class="code-text c_normal cl2" xml:space="preserve"></text>
  <text x="24" y="104" class="code-text c_keyword cl3" xml:space="preserve">function usagi_routine() {</text>
  <text x="24" y="122" class="code-text c_string cl4" xml:space="preserve">    const battle_cry = &quot;URA! URARURA! URAAAAA!&quot;;</text>
  <text x="24" y="140" class="code-text c_string cl5" xml:space="preserve">    const excitement = &quot;YAHA! YAHA! YAHA!&quot;;</text>
  <text x="24" y="158" class="code-text c_normal cl6" xml:space="preserve">    while (energy &gt; 0) {</text>
  <text x="24" y="176" class="code-text c_fn cl7" xml:space="preserve">        scream(battle_cry);</text>
  <text x="24" y="194" class="code-text c_string cl8" xml:space="preserve">        dance(&quot;IYAA-HA! FUUUN~ WAHA!&quot;);</text>
  <text x="24" y="212" class="code-text c_fn cl9" xml:space="preserve">        vibrate(&quot;PULULULULULULU~~~~~!&quot;);</text>
  <text x="24" y="230" class="code-text c_normal cl10" xml:space="preserve">    }</text>
  <text x="24" y="248" class="code-text c_keyword cl11" xml:space="preserve">    return &quot;HAA?!&quot;;</text>
  <text x="24" y="266" class="code-text c_keyword cl12" xml:space="preserve">}</text>
  <text x="24" y="284" class="code-text c_comment cl13" xml:space="preserve">// [EXEC] usagi_routine() -&gt; Compiling Mascot ASCII Art...</text>
  <text x="24" y="302" class="code-text c_comment cl14" xml:space="preserve">// [OK] Ready! Clearing screen &amp; Rendering...</text>
</g>

