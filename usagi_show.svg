  .al11 { animation-delay: 3.925s; }
  .al12 { animation-delay: 4.000s; }
  .al13 { animation-delay: 4.075s; }
  .al14 { animation-delay: 4.150s; }
  .al15 { animation-delay: 4.225s; }
