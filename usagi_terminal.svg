<circle cx="56" cy="17" r="5.5" fill="#27c93f" />

<!-- Phase 1: Big Usagi Code (Types slowly, stays clearly, then vanishes) -->
<g class="code-container">
  <text x="24" y="52" class="code-text c_comment cl0" xml:space="preserve">// &gt;&gt;&gt; USAGI_SCRIPT.ura &lt;&lt;&lt;</text>
  <text x="24" y="76" class="code-text c_keyword cl1" xml:space="preserve">import { yaha, ura, pulululu, haa, iyaaha } from &quot;chiikawa&quot;;</text>
  <text x="24" y="100" class="code-text c_normal cl2" xml:space="preserve"></text>
  <text x="24" y="124" class="code-text c_keyword cl3" xml:space="preserve">function usagi_routine() {</text>
  <text x="24" y="148" class="code-text c_string cl4" xml:space="preserve">    const battle_cry = &quot;URA! URARURA! URAAAAA!&quot;;</text>
  <text x="24" y="172" class="code-text c_string cl5" xml:space="preserve">    const excitement = &quot;YAHA! YAHA! YAHA!&quot;;</text>
  <text x="24" y="196" class="code-text c_normal cl6" xml:space="preserve">    while (energy &gt; 0) {</text>
  <text x="24" y="220" class="code-text c_fn cl7" xml:space="preserve">        scream(battle_cry);</text>
  <text x="24" y="244" class="code-text c_string cl8" xml:space="preserve">        dance(&quot;IYAA-HA! FUUUN~ WAHA!&quot;);</text>
  <text x="24" y="268" class="code-text c_fn cl9" xml:space="preserve">        vibrate(&quot;PULULULULULULU~~~~~!&quot;);</text>
  <text x="24" y="292" class="code-text c_normal cl10" xml:space="preserve">    }</text>
  <text x="24" y="316" class="code-text c_keyword cl11" xml:space="preserve">    return &quot;HAA?!&quot;;</text>
  <text x="24" y="340" class="code-text c_keyword cl12" xml:space="preserve">}</text>
  <text x="24" y="364" class="code-text c_comment cl13" xml:space="preserve">// [EXEC] usagi_routine() -&gt; Compiling Mascot ASCII Art...</text>
  <text x="24" y="388" class="code-text c_comment cl14" xml:space="preserve">// [OK] Ready! Clearing screen &amp; Rendering...</text>
</g>

