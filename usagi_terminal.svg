<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 778" width="100%" height="auto">
<style>

  .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10px; }
  .titlebar { fill: #161b22; }
  
  @keyframes codeLive {
    0% { opacity: 0; }
    1% { opacity: 1; }
    94% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes hideContainer {
    to { opacity: 0; visibility: hidden; }
  }
  @keyframes appearArt {
    to { opacity: 1; }
  }

  .code-container {
    animation: hideContainer 0.1s forwards;
    animation-delay: 4.80s;
  }

  .code-text {
    font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    font-size: 16px;
    font-weight: 500;
    opacity: 0;
  }
  .c_comment { fill: #8b949e; font-style: italic; }
  .c_keyword { fill: #ff7b72; font-weight: 600; }
  .c_string  { fill: #a5d6ff; }
  .c_fn      { fill: #d2a8ff; }
  .c_normal  { fill: #c9d1d9; }

  .art-text {
    font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
    font-size: 12.5px;
    fill: #00F2FE;
    opacity: 0;
    animation: appearArt 0.01s forwards;
  }
  .cl0 { animation: codeLive 4.800s forwards; animation-delay: 0.000s; }
  .cl1 { animation: codeLive 4.580s forwards; animation-delay: 0.220s; }
  .cl2 { animation: codeLive 4.360s forwards; animation-delay: 0.440s; }
  .cl3 { animation: codeLive 4.140s forwards; animation-delay: 0.660s; }
  .cl4 { animation: codeLive 3.920s forwards; animation-delay: 0.880s; }
