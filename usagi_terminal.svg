<path d="M 0,10 A 10,10 0 0,1 10,0 L 974,0 A 10,10 0 0,1 984,10 L 984,34 L 0,34 Z" class="titlebar" />
<circle cx="20" cy="17" r="5.5" fill="#ff5f56" />
