  .cl12 { animation: codeLive 2.160s forwards; animation-delay: 2.640s; }
  .cl13 { animation: codeLive 1.940s forwards; animation-delay: 2.860s; }
  .cl14 { animation: codeLive 1.720s forwards; animation-delay: 3.080s; }
